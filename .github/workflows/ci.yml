name: Vidown Continuous Integration

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Build & Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build extension from sources
        run: npm run build

      - name: Run verification test suites
        run: |
          node -e "
          const fs = require('fs');
          const cp = require('child_process');
          const files = fs.readdirSync('tests').filter(f => f.startsWith('test_') && f.endsWith('.js'));
          let passed = 0, failed = 0;
          for (const f of files) {
            try {
              cp.execSync('node tests/' + f, { stdio: 'pipe' });
              passed++;
            } catch (err) {
              console.error('FAIL: ' + f);
              if (err.stdout && err.stdout.length) console.error(err.stdout.toString());
              if (err.stderr && err.stderr.length) console.error(err.stderr.toString());
              failed++;
            }
          }
          console.log('\nCI TEST SUMMARY: ' + passed + ' passed, ' + failed + ' failed.');
          if (failed > 0) process.exit(1);
          "
