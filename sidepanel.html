<!DOCTYPE html>
<html>
<head>
    <meta charset="utf8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0">
    <title></title>
<link href="././css/sidepanel.css" rel="stylesheet"></head>
<body class="body">
<div id="welcome"></div>
<div id="downloads" hidden></div>
<div id="one-click-block" hidden></div>
<div id="footer" hidden></div>

<script type="text/mustache-template" id="load-template">
    <div class="loader">
        <div class="random-loading-text"> {{i18n_loading_text}} </div>
        {{#repeat}}
            <div class="big-container">
                <span class="loading-filename">
                    <div class="skeleton w24 h24"></div>
                    <div class="skeleton w296 h24"></div>
                </span>
                <span class="loading-content-holder">
                    <div class="skeleton w180 h101"></div>
                        <span class="options-holder">
                            <div class="skeleton w136 h36"></div>
                            <div class="skeleton w136 h36"></div>
                        </span>
                </span>
            </div>
        {{/repeat}}
    </div>
</script>
<script type="text/mustache-template" id="list-template">
    <div class="tabs">
        <button class="tab active" id="video-audio-tab-button">
            <svg width="16" height="13" viewBox="0 0 16 13" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M1.5064 12.5C1.08545 12.5 0.729146 12.3541 0.437479 12.0625C0.145827 11.7708 0 11.4145 0 10.9935V1.50642C0 1.08547 0.145827 0.729167 0.437479 0.4375C0.729146 0.145833 1.08545 0 1.5064 0H10.9935C11.4145 0 11.7708 0.145833 12.0624 0.4375C12.3541 0.729167 12.4999 1.08547 12.4999 1.50642V5.32052L15.4326 2.38785V10.1121L12.4999 7.17944V10.9935C12.4999 11.4145 12.3541 11.7708 12.0624 12.0625C11.7708 12.3541 11.4145 12.5 10.9935 12.5H1.5064ZM1.5064 11.25H10.9935C11.0683 11.25 11.1298 11.2259 11.1778 11.1779C11.2259 11.1298 11.25 11.0683 11.25 10.9935V1.50642C11.25 1.43162 11.2259 1.37019 11.1778 1.3221C11.1298 1.27402 11.0683 1.24998 10.9935 1.24998H1.5064C1.4316 1.24998 1.37017 1.27402 1.32208 1.3221C1.274 1.37019 1.24996 1.43162 1.24996 1.50642V10.9935C1.24996 11.0683 1.274 11.1298 1.32208 11.1779C1.37017 11.2259 1.4316 11.25 1.5064 11.25Z" fill="#4FBA69"/>
            </svg>
            {{i18n_video_audio_tab}}
        </button>
        <button class="tab" id="image-tab-button">
            <svg width="15" height="15" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M1.50642 14.1666C1.08547 14.1666 0.729167 14.0208 0.4375 13.7291C0.145833 13.4375 0 13.0812 0 12.6602V1.50642C0 1.08547 0.145833 0.729167 0.4375 0.4375C0.729167 0.145833 1.08547 0 1.50642 0H12.6602C13.0812 0 13.4375 0.145833 13.7291 0.4375C14.0208 0.729167 14.1666 1.08547 14.1666 1.50642V12.6602C14.1666 13.0812 14.0208 13.4375 13.7291 13.7291C13.4375 14.0208 13.0812 14.1666 12.6602 14.1666H1.50642ZM1.50642 12.9166H12.6602C12.7243 12.9166 12.7831 12.8899 12.8365 12.8365C12.8899 12.7831 12.9166 12.7243 12.9166 12.6602V1.50642C12.9166 1.44231 12.8899 1.38354 12.8365 1.3301C12.7831 1.27669 12.7243 1.24998 12.6602 1.24998H1.50642C1.44231 1.24998 1.38353 1.27669 1.3301 1.3301C1.27669 1.38354 1.24998 1.44231 1.24998 1.50642V12.6602C1.24998 12.7243 1.27669 12.7831 1.3301 12.8365C1.38353 12.8899 1.44231 12.9166 1.50642 12.9166ZM2.70835 11.0416H11.5224L8.78202 7.38781L6.44229 10.4327L4.77562 8.30129L2.70835 11.0416Z" fill="#1A1C1E"/>
            </svg>         
            {{i18n_image_tab}}
        </button>
        <button id="popup-closer" class =" sidepanel-tooltip-trigger">

            </svg>
            <span class = "sidepanel-tooltip">
                {{i18n_tooltip_setting}}
            </span>
        </button>
        <button id="sidepanel-refresher" class =" sidepanel-tooltip-trigger">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M10.0247 17.0833C9.04182 17.0833 8.12088 16.8974 7.26191 16.5256C6.40293 16.1538 5.654 15.6485 5.01511 15.0096C4.37623 14.3707 3.87089 13.6218 3.49909 12.7628C3.1273 11.9038 2.94141 10.9829 2.94141 10C2.94141 9.0171 3.1273 8.09616 3.49909 7.23719C3.87089 6.37821 4.37623 5.62928 5.01511 4.9904C5.654 4.35152 6.40293 3.84619 7.26191 3.4744C8.12088 3.10259 9.04182 2.91669 10.0247 2.91669C11.0728 2.91669 12.0685 3.13704 13.0119 3.57775C13.9552 4.01846 14.7651 4.63785 15.4413 5.43592V3.46154H16.6913V7.69227H12.4606V6.44229H14.6401C14.0653 5.73396 13.3799 5.1776 12.584 4.77323C11.7881 4.36885 10.935 4.16667 10.0247 4.16667C8.39972 4.16667 7.02125 4.73264 5.8893 5.86458C4.75736 6.99653 4.19139 8.375 4.19139 10C4.19139 11.625 4.75736 13.0035 5.8893 14.1354C7.02125 15.2674 8.39972 15.8333 10.0247 15.8333C11.4831 15.8333 12.7547 15.3598 13.8396 14.4127C14.9245 13.4655 15.5722 12.2724 15.7827 10.8333H17.0583C16.8553 12.6239 16.0834 14.1132 14.7426 15.3013C13.4018 16.4893 11.8292 17.0833 10.0247 17.0833Z" fill="currentColor"/>
            </svg>
            <span class = "sidepanel-tooltip">
                {{i18n_tooltip_refresh}}
            </span>
        </button>
    </div>
    <div class="downloads-list dark-theme" id="video-audio-tab">
        {{^loading_video}}
            {{#hasDownloads}}
                <span class = "sticky-top-container">
                    <span class = "top-download-list-container">
                        <span class = "total-text"> {{i18n_found}} <b>{{downloads.length}}</b> {{i18n_videos_audios}} </span>
                        <span class = "top-right-button-container" hidden>
                            <button class = "unselect-button"> 
                                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M5.33333 15.5448L4.45514 14.6666L9.12181 9.99993L4.45514 5.33327L5.33333 4.45508L9.99999 9.12174L14.6667 4.45508L15.5448 5.33327L10.8782 9.99993L15.5448 14.6666L14.6667 15.5448L9.99999 10.8781L5.33333 15.5448Z" fill="currentColor"/>
                                </svg>
                                {{i18n_clear}}
                            </button>
                            <button class = "download-all-button"> 
                                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M5.25645 16.2501C4.8355 16.2501 4.4792 16.1043 4.18753 15.8126C3.89586 15.521 3.75003 15.1647 3.75003 14.7437V12.5002H5.00001V14.7437C5.00001 14.8078 5.02672 14.8666 5.08013 14.92C5.13356 14.9735 5.19234 15.0002 5.25645 15.0002H14.7436C14.8077 15.0002 14.8665 14.9735 14.9199 14.92C14.9733 14.8666 15 14.8078 15 14.7437V12.5002H16.25V14.7437C16.25 15.1647 16.1042 15.521 15.8125 15.8126C15.5208 16.1043 15.1645 16.2501 14.7436 16.2501H5.25645ZM10 13.013L6.44236 9.45531L7.32055 8.5515L9.37503 10.606V3.60596H10.625V10.606L12.6795 8.5515L13.5577 9.45531L10 13.013Z" fill="currentColor"/>
                                </svg>
                                {{i18n_download}}
                            </button>
                        </span>
                    </span>
                </span>
                <span class = "content-download-list-container">
                    {{#downloads}}
                        {{>media_template}}
                    {{/downloads}}
                </span>
            {{/hasDownloads}}
            {{^downloads}}
                <div class = "no-media-container">
                    <img class="banner" src="images/NoFileIcon.png" />
                    <div class="no-media">
                        {{i18n_no_media_found}}
                    </div>
                </div>
            {{/downloads}}
        {{/loading_video}}
        {{#loading_video}}
            {{>loading_template}}
        {{/loading_video}}
    </div>

    <div class="downloads-list dark-theme" id="image-tab">
        {{^loading_image}}
            {{#hasImageDownloads}}
                <span class = "sticky-top-container">
                    <span class = "top-download-list-container">
                        <label style="display: flex; align-items: center; gap: 8px">
                            <input id="select-all-checkbox" type="checkbox" />
                            <span>{{i18n_select_all}}</span>
                        </label>
                        <span>
                            <div class="dropdown">
                                <button class="dropdown-btn">
                                    <div class="button-text">{{i18n_all_sizes}}</div>
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M12 15L7 10H17L12 15Z" fill="currentColor"/>
                                    </svg>
                                </button>
                                <ul class="dropdown-menu">
                                    <li id="all-option">{{i18n_all_sizes}}</li>
                                    <li id="large-option">{{i18n_large}}</li>
                                    <li id="medium-option">{{i18n_medium}}</li>
                                    <li id="small-option">{{i18n_small}}</li>
                                </ul>
                            </div>
                        </span>
                            
                    </span>
                    <span class = "top-download-list-container image-total-text-container">
                        <span class = "total-text"> {{i18n_found}} <b>{{imageDownloads.length}}</b> {{i18n_photos}} </span>
                        <span class = "top-right-button-container" hidden >
                            <button class = "unselect-button"> 
                                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M5.33333 15.5448L4.45514 14.6666L9.12181 9.99993L4.45514 5.33327L5.33333 4.45508L9.99999 9.12174L14.6667 4.45508L15.5448 5.33327L10.8782 9.99993L15.5448 14.6666L14.6667 15.5448L9.99999 10.8781L5.33333 15.5448Z" fill="#76777A"/>
                                </svg>
                                {{i18n_clear}}
                            </button>
                            <button class = "download-all-button"> 
                                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M5.25645 16.2501C4.8355 16.2501 4.4792 16.1043 4.18753 15.8126C3.89586 15.521 3.75003 15.1647 3.75003 14.7437V12.5002H5.00001V14.7437C5.00001 14.8078 5.02672 14.8666 5.08013 14.92C5.13356 14.9735 5.19234 15.0002 5.25645 15.0002H14.7436C14.8077 15.0002 14.8665 14.9735 14.9199 14.92C14.9733 14.8666 15 14.8078 15 14.7437V12.5002H16.25V14.7437C16.25 15.1647 16.1042 15.521 15.8125 15.8126C15.5208 16.1043 15.1645 16.2501 14.7436 16.2501H5.25645ZM10 13.013L6.44236 9.45531L7.32055 8.5515L9.37503 10.606V3.60596H10.625V10.606L12.6795 8.5515L13.5577 9.45531L10 13.013Z" fill="currentColor"/>
                                </svg>
                                {{i18n_download}}
                            </button>
                        </span>
                    </span>
                </span>
            {{/hasImageDownloads}}
            <span class = "content-download-list-container">
                {{#imageDownloads}}
                    {{>media_image_template}}
                {{/imageDownloads}}
            </span>
            {{^imageDownloads}}
                <div class="no-media-container">
                    <img class="banner" src="images/NoFileIcon.png" />
                    <div class="no-media">
                        {{i18n_no_media_found}}
                    </div>
                </div>
            {{/imageDownloads}}
            <div class="no-media-container small-container" hidden>
                <img class="banner" src="images/NoFileIcon.png" />
                <div class="no-media">
                    {{i18n_no_media_found}}
                </div>
            </div>
        {{/loading_image}}
        {{#loading_image}}
             {{>loading_template}}
        {{/loading_image}}
    </div>
</script>
<script type="text/javascript" src="./common.js"></script><script type="text/javascript" src="./sidepanel.js"></script><script type="text/javascript" src="./cleanup.js"></script></body>
</html>
